/*
    Create a function pow(x,n) that returns x to the n power
    Create a webpage that prompts for x,n and shows the result
*/

<!DOCTYPE html>
    <html>
        <body>
            <script>
                'use strict';
                function pow(x, n) {
                    let result = x;
                    for(let i = 1; i < n; i++) {
                        result *= x;
                    }
                    return result;
                }

                let x = prompt("Enter x:", 0);
                let n = prompt("Enter n:", 0);
                if (n < 1) {
                    alert(`${n} must be a positive integer`);
                } else {
                    alert(pow(x, n));
                }
            </script>
        </body>
    </html>
