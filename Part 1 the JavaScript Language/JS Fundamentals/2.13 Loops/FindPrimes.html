/*
    Write a loop that outputs all prime numbers
    from 2 to n.
*/

<!DOCTYPE html>
    <html>
        <body>
            <script>
                let n = prompt("Enter n:", 10);
                for(let i = 2; i <= n; i++) {
                    if(i == 2) {
                        alert(i);
                    } else {
                        let flag = true;
                        for(let j = 2; j <= i/2; j++) {
                            if(i % j == 0) {
                                flag = false;
                                break;
                            }
                        }
                        if(flag) {
                            alert(i);
                        }
                    }
                }
            </script>
        </body>
    </html>
